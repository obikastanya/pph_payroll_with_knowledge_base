# Tema demo (proyektor, terang). Jalankan dari akar repo: env\Scripts\streamlit.exe run ui\app.py
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f2"
textColor = "#0b0b0b"
baseFontSize = 17
baseRadius = "medium"
borderColor = "#e3e2de"
showWidgetBorder = true
metricValueFontSize = "1.55rem"
metricValueFontWeight = 650
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
