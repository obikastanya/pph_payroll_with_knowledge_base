# GraphDB Free for the knowledge graph of the full system (decision log, 2026-10-27). Full steps in SETUP.md.
#
#   1. Put the GraphDB Free license code (Graphwise email, base64) in .env as GRAPHDB_LICENSE.
#   2. env\Scripts\python system\tools\graphdb_setup.py
#      writes it to graphdb/graphdb.license (not committed), starts this container, and creates the pph21 repository.
#   3. Workbench and SPARQL endpoint: http://localhost:7200
#   Later: docker compose -f graphdb/docker-compose.yml up -d (or down).
#
# Repository data lives in graphdb/home/ (not committed); the system rebuilds it from the Delta log.
services:
  graphdb:
    image: ontotext/graphdb:11.5.1
    container_name: pph21-graphdb
    ports:
      - "7200:7200"
    environment:
      GDB_JAVA_OPTS: >-
        -Xmx2g
        -Dgraphdb.home=/opt/graphdb/home
        -Dgraphdb.license.file=/opt/graphdb/license/graphdb.license
    volumes:
      - ./home:/opt/graphdb/home
      - ./graphdb.license:/opt/graphdb/license/graphdb.license:ro
    restart: unless-stopped
