    catatan: "lapisan teks Lampiran A PMK 10/72/105 2025; 96129 hanya di PMK 105 (perlu cek gambar halaman)"

riwayat:
  - tanggal: "2026-10-01"
    perubahan: "manifest awal; hash dari hasil ekstraksi agen regulasi (dataset/01_regulasi/README.md)"
  - tanggal: "2026-10-01"
    perubahan: "WP1c double-entry dari gambar halaman: 512 sel cocok 100% (dataset/01_regulasi/tables_ekstraksi2/LAPORAN_DOUBLE_ENTRY.md); bpjs.csv dinormalisasi format; klu_dtp ditambahkan"
