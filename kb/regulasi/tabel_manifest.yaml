    kolom_rupiah: [maks_bulanan, maks_tahunan]
    kolom_persen: [persen]
  - nama: bpjs
    path: ../../dataset/01_regulasi/tables/bpjs.csv
    sha256: 1fc8ec6a842a61ec376242920c3fefcfc562be38cfb0ef5ed3a87adaabff82e2
